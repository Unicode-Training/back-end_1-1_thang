name: thang_mysql
services:
  mysql_db:
    image: mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - 3311:3306

  redis:
    image: redis
    restart: on-failure
    ports:
      - 6380:6379
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
